name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # v5: v4 targets Node 20, which GitHub has deprecated on its runners.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Match the development runtime and @types/node, so a version
          # difference can never be the reason CI disagrees with a laptop.
          node-version: 24
          cache: npm

      - run: npm ci

      # Each step runs even if an earlier one failed, so one push reports
      # every problem rather than only the first. Chasing failures one per
      # run is how a red pipeline stays red for a week.
      - name: Typecheck
        if: '!cancelled()'
        run: npm run typecheck

      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Test
        if: '!cancelled()'
        run: npm test

      # A critical advisory against a runtime dependency is the one class of
      # dependency problem that cannot wait for someone to notice. Next 15.5.22
      # sat in this repo for a month carrying an unauthenticated RCE
      # (CVE-2026-75604) and nothing said so.
      #
      # Scoped deliberately. `--omit=dev` because a build tool's advisory is not
      # a deployed vulnerability, and `--audit-level=critical` because the high
      # ones currently outstanding (postcss, sharp) need attacker-controlled CSS
      # at build time or an image endpoint this app does not use. A gate that
      # cries every week is a gate someone turns off.
      - name: Audit runtime dependencies
        if: '!cancelled()'
        run: npm audit --omit=dev --audit-level=critical

      - name: Build
        if: '!cancelled()'
        run: npm run build
        env:
          # Build-time only. Never a real credential — the app must not need a
          # reachable database to compile.
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
          AUTH_SECRET: placeholder-secret-for-build-only
